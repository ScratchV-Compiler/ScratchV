name: Topic 06 Compiler Benchmark

on:
  push:
  pull_request:

jobs:
  topic06-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ScratchV and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r ScratchV-topic06-deliverable/requirements-topic06.txt

      - name: Verify Topic 06 integration contracts
        run: python -m pytest tests/test_topic06_integration.py -q

      - name: Run supported correctness gates
        run: |
          python ScratchV-topic06-deliverable/run_tests.py --category activation --fail-on-test-failure
          python ScratchV-topic06-deliverable/run_tests.py --category elementwise --fail-on-test-failure
          python ScratchV-topic06-deliverable/run_tests.py --category loop --fail-on-test-failure

      - name: Generate full diagnostic benchmark report
        run: python ScratchV-topic06-deliverable/run_tests.py --benchmark 3

      - name: Upload Topic 06 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topic06-benchmark-reports
          path: |
            ScratchV-topic06-deliverable/reports/report.md
            ScratchV-topic06-deliverable/reports/report.json
            ScratchV-topic06-deliverable/reports/failures/
            ScratchV-topic06-deliverable/reports/benchmark_baseline.json
