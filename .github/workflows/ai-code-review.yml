name: AI Code Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number in this repository
        required: true
        type: number
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # pull_request_target checks out the trusted base; never run PR head code with secrets.
      # workflow_dispatch uses the explicitly selected trusted ref.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch every PR file
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            fs.mkdirSync('review-plan', {recursive: true});
            const data = {repository: context.repo.owner + '/' + context.repo.repo, errors: []};
            try {
              const pull_number = Number(process.env.PR_NUMBER);
              if (!Number.isSafeInteger(pull_number) || pull_number <= 0) throw new Error('Invalid PR number');
              data.pr_number = pull_number;
              const params = {...context.repo, pull_number};
              const before = (await github.rest.pulls.get(params)).data;
              data.head = before.head.sha;
              data.changed_files = before.changed_files;
              data.files = await github.paginate(github.rest.pulls.listFiles, {...params, per_page: 100});
              const after = (await github.rest.pulls.get(params)).data;
              data.head_after = after.head.sha;
            } catch (error) {
              data.errors.push('GitHub PR fetch failed; see failed step status.');
              core.setFailed('Could not fetch a complete PR file manifest.');
            } finally {
              fs.writeFileSync('review-plan/raw.json', JSON.stringify(data));
            }
      - name: Plan bounded batches
        id: plan
        if: always()
        run: python3 scripts/ai_code_review.py plan --input review-plan/raw.json --output review-plan/plan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-review-plan
          path: review-plan/
          if-no-files-found: error
          overwrite: true

  review:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ai-review-plan
          path: review-plan
      - name: Review batch
        env:
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          REVIEW_BATCH: ${{ matrix.batch }}
        run: |
          python3 scripts/ai_code_review.py review \
            --plan review-plan/plan.json --batch "$REVIEW_BATCH" \
            --prompt .github/prompts/code-review-prompt.md \
            --output "review-batch/batch-$REVIEW_BATCH.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-review-batch-${{ matrix.batch }}
          path: review-batch/
          if-no-files-found: error
          overwrite: true

  ai-code-review:
    needs: [prepare, review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ai-review-*
          path: review-downloads
      - name: Account for every file
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/ai_code_review.py summarize \
            --directory review-downloads --output review-summary --run-url "$RUN_URL"
      - name: Check current head and post coverage summary
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const pull_number = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(pull_number) || pull_number <= 0) {
              core.setFailed('Invalid PR number');
              return;
            }
            const summaryPath = 'review-summary/summary.json';
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            const pr = (await github.rest.pulls.get({...context.repo, pull_number})).data;
            if (summary.head && pr.head.sha !== summary.head) {
              summary.complete = false;
              summary.errors.push('PR head changed after planning; results are stale.');
              fs.writeFileSync(summaryPath, JSON.stringify(summary, null, 2));
              for (const path of ['review-summary/review_output.md', 'review-summary/review_comment.md']) {
                const old = fs.readFileSync(path, 'utf8');
                fs.writeFileSync(path, '> STALE: PR head changed; this review does not cover the current PR.\n\n' +
                  old.replace('Coverage: **complete**', 'Coverage: **INCOMPLETE**'));
              }
              core.setFailed('Stale review results; not overwriting the current PR comment.');
              return;
            }
            const body = fs.readFileSync('review-summary/review_comment.md', 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pull_number, per_page: 100,
            });
            const previous = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('# 🤖 AI Code Review'));
            if (previous) {
              await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number: pull_number, body});
            }
            await core.summary.addRaw(body).write();
      - name: Upload full results even when coverage is incomplete
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-code-review
          path: review-summary/
          if-no-files-found: error
          overwrite: true
      - name: Require complete review coverage
        if: always()
        run: python3 scripts/ai_code_review.py gate --summary review-summary/summary.json
