name: LLM Deploy v1.0

# CI for the Qwen3-0.6B-on-RISC-V project (docs/llm-deploy-v1.0/).
#
# Separate from ci.yml on purpose: that one tests the ScratchV compiler, this
# one tests the deployment project. A failure here should not read as "the
# compiler is broken".
#
# Scope is deliberately week 1 only. The plan's later hard gates
# (numeric:ir-full-qwen3 at W3, numeric:qemu-full-qwen3 at W4,
# e2e:qemu-paris at W5, release:gate at W8) are NOT stubbed out here: jobs for
# work two to seven weeks away would sit green and idle in every run. They get
# added when their week arrives, from the plan's §4.3 table.
#
# Only jobs the plan's W1 acceptance list actually names, plus the toolchain
# prerequisite the probes need:
#
#   docs:interfaces  docs:risks        (docs/llm-deploy-v1.0/W1/)
#   probe:qemu-matmul  probe:small-transformer  probe:qwen3-onnx
#
# NOTE ON JOB IDS: GitHub job ids may not contain ':'. The ids here use
# dashes; the plan's notation (probe:qemu-matmul and friends) is carried in
# each job's `name:` so the UI and the plan read the same.

on:
  pull_request:
    paths:
      - 'docs/llm-deploy-v1.0/**'
      - 'probes/**'
      - 'scripts/check_llm_deploy_docs.py'
      - 'export_qwen3_onnx.py'
      - 'scratchv/**'
      - '.github/workflows/llm-deploy.yml'
  schedule:
    # Nightly, off the hour: 19:23 UTC = 03:23 北京时间. Carries the probe that
    # needs the weights and real memory.
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Deliverables the probes are expected to provide. A probe only runs once its
  # script exists, so the pipeline is green while a week's work is in flight
  # and goes hard-red the moment the script is there but wrong.
  PROBE_MATMUL: probes/w1_matmul_4x4/run.py
  PROBE_TRANSFORMER: probes/w1_tiny_transformer/run.py
  PROBE_QWEN3_EXPORT: probes/w1_qwen3_export/run.py

jobs:
  # ═════════════════════════════════════════════════════════════════════════
  # PR 快速门禁 — 每次 PR，目标 ≤15 min，阻塞合并
  # ═════════════════════════════════════════════════════════════════════════

  docs-interfaces:
    name: "docs:interfaces"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check interfaces.md covers the four contracts
        run: python3 scripts/check_llm_deploy_docs.py --week W1

  docs-risks:
    name: "docs:risks"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check risks.md has >=15 risks, each with a Plan B
        run: python3 scripts/check_llm_deploy_docs.py --week W1

  toolchain:
    name: "setup:riscv-toolchain"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install RISC-V toolchain and QEMU
        run: |
          set -euo pipefail
          if ! command -v clang >/dev/null || ! command -v ld.lld >/dev/null || ! command -v qemu-riscv32 >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y clang lld qemu-user
          fi
      - name: Verify
        run: |
          set -euo pipefail
          missing=""
          for tool in clang ld.lld qemu-riscv32; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing tools:$missing"
            exit 1
          fi
          clang --version | head -1
          qemu-riscv32 --version | head -1

  probe-qemu-matmul:
    name: "probe:qemu-matmul"
    needs: [toolchain]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[all]"
          python3 -m pip install numpy
      - name: 4x4 MatMul through IR -> RISC-V -> QEMU
        # Checked inside the step, not via a job-level `if`, because a
        # job-level condition is evaluated before the repository is on disk.
        run: |
          set -euo pipefail
          if [ ! -f "$PROBE_MATMUL" ]; then
            echo "::notice::$PROBE_MATMUL not delivered yet — W1 probe pending"
            exit 0
          fi
          python3 "$PROBE_MATMUL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-qemu-matmul
          path: probes/w1_matmul_4x4/out/
          if-no-files-found: ignore

  probe-small-transformer:
    name: "probe:small-transformer"
    needs: [toolchain]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[all]"
          python3 -m pip install numpy onnxruntime torch
      - name: 2-layer Transformer ONNX -> IR vs ONNX Runtime
        run: |
          set -euo pipefail
          if [ ! -f "$PROBE_TRANSFORMER" ]; then
            echo "::notice::$PROBE_TRANSFORMER not delivered yet — W1 probe pending"
            exit 0
          fi
          python3 "$PROBE_TRANSFORMER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-small-transformer
          path: probes/w1_tiny_transformer/out/
          if-no-files-found: ignore

  # ═════════════════════════════════════════════════════════════════════════
  # Nightly — 需要权重与大内存的 W1 探测
  # ═════════════════════════════════════════════════════════════════════════

  probe-qwen3-onnx:
    name: "probe:qwen3-onnx"
    if: github.event_name != 'pull_request'
    # Needs the model weights and real memory, so it runs on the self-hosted
    # runner rather than a GitHub-hosted one.
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Export Qwen3-0.6B to ONNX and run it under ONNX Runtime
        run: |
          set -euo pipefail
          if [ ! -f "$PROBE_QWEN3_EXPORT" ]; then
            echo "::notice::$PROBE_QWEN3_EXPORT not delivered yet — W1 probe pending"
            exit 0
          fi
          python3 "$PROBE_QWEN3_EXPORT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-qwen3-onnx
          path: probes/w1_qwen3_export/out/
          if-no-files-found: ignore

  # ═════════════════════════════════════════════════════════════════════════
  # 状态汇总 — 永远运行，报告还差哪些 W1 交付物
  # ═════════════════════════════════════════════════════════════════════════

  w1-status:
    name: "W1 status"
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Report which W1 deliverables are still missing
        run: |
          echo "## W1 交付物状态" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 交付物 | 状态 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in docs/llm-deploy-v1.0/W1/interfaces.md \
                   docs/llm-deploy-v1.0/W1/risks.md \
                   probes/w1_matmul_4x4/run.py \
                   probes/w1_tiny_transformer/run.py \
                   probes/w1_qwen3_export/run.py ; do
            if [ -f "$f" ]; then
              echo "| \`$f\` | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$f\` | ❌ 未交付 |" >> "$GITHUB_STEP_SUMMARY"
              echo "::notice::W1 交付物未完成: $f"
            fi
          done
