name: LLM Deploy v1.0

# CI for the Qwen3-0.6B-on-RISC-V project (docs/llm-deploy-v1.0/).
#
# One pipeline for the whole LLM line: W1/W2 PR gates, the opt-in W3
# preparation and full 28-layer IR numeric gates, and the nightly schedule.
# Merged from llm-deploy.yml + w3-preparation.yml + w3-full-numeric.yml +
# w3-nightly.yml so that one file, one schedule and one manual entry point
# describe everything. The previous split scheduled the same 23:23 nightly
# from two files at once.
#
# Separate from ci.yml on purpose: that one tests the ScratchV compiler, this
# one tests the deployment project. A failure here should not read as "the
# compiler is broken".
#
# PRs execute small numeric gates and a separate complete frontend audit.
# Both are mandatory for the W2 acceptance result. Full-model ORT and the W3
# gates remain manual/nightly; frontend parsing never claims full IR execution.
#
#   docs:interfaces  docs:risks  docs:linux-reproduction
#   probe:qemu-matmul  probe:small-transformer  probe:qwen3-onnx
#   numeric:ir-qwen3-small  frontend:parse-qwen3
#   unit:frontend-ops  unit:backend-ops  unit:runtime  integration:runtime-model
#
# The W3 jobs are opt-in. They run on a manual dispatch with
# run_w3_validation=true, or on the schedule when the W3_NIGHTLY_ENABLED
# repository variable is set. The default W1/W2 checks do not imply
# full-model IR acceptance.

on:
  pull_request:
    paths:
      - 'docs/llm-deploy-v1.0/**'
      - 'probes/**'
      - 'scripts/check_llm_deploy_docs.py'
      - 'scripts/check_linux_repro_docs.py'
      - 'tests/test_linux_repro_docs.py'
      - 'scripts/check_w1_repro_env.py'
      - 'scripts/run_w2_acceptance.py'
      - 'scripts/check_w2_ci_results.py'
      - 'scripts/summarize_w2_ci.py'
      - 'scripts/summarize_w3_ci.py'
      - 'export_qwen3_onnx.py'
      - 'scratchv/**'
      - 'requirements/**'
      - 'pyproject.toml'
      - 'tests/test_qwen3_small*.py'
      - 'tests/test_qwen3_full*.py'
      - 'tests/test_tensor*.py'
      - 'tests/test_riscv_tensor*.py'
      - 'tests/test_optimizer*.py'
      - 'tests/qwen_artifacts.py'
      - 'tests/test_qwen_artifact_selection.py'
      - 'tests/test_w1_qwen3*.py'
      - 'tests/test_w1_repro_env.py'
      - 'tests/test_qwen3_frontend_patterns.py'
      - 'tests/test_qwen3_tokenizer.py'
      - 'tests/test_llm_inputs.py'
      - 'tests/test_w2_*.py'
      - 'tests/test_numeric_metrics.py'
      - 'tests/test_numeric_summary.py'
      - 'tests/test_w3_actions_summary.py'
      - 'tests/test_w3_workflows.py'
      - '.github/workflows/llm-deploy.yml'
  schedule:
    # Nightly, off the hour: 19:23 UTC = 03:23 北京时间.
    - cron: '23 19 * * *'
  workflow_dispatch:
    inputs:
      run_w3_validation:
        description: Also run complete W3 preparation and seven-case IR validation
        type: boolean
        required: false
        default: false
      w3_case:
        description: W3 coverage; short_17 is a diagnostic and never passes acceptance
        type: choice
        required: false
        default: all
        options:
          - all
          - short_17

permissions:
  contents: read

env:
  # Delivered numeric gates are mandatory: missing scripts/tools are failures.
  PROBE_MATMUL: probes/w1_matmul_4x4/run.py
  PROBE_TRANSFORMER: probes/w1_tiny_transformer/run.py
  PROBE_QWEN3_EXPORT: probes/w1_qwen3_export/run.py
  PROBE_QWEN3_SMALL: probes/w2_qwen3_small/run.py
  PROBE_QWEN3_PARSE: probes/w2_qwen3_parse/run.py
  QWEN3_PY: output/qwen3-probe-venv/bin/python

jobs:
  llm-deploy:
    name: "LLM Deploy v1.0 / W1 + W2"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # ── 前置：RISC-V 工具链 + Python 依赖 ──────────────────────────────
      - name: Install RISC-V toolchain and QEMU
        run: |
          set -euo pipefail
          if ! command -v clang >/dev/null || ! command -v ld.lld >/dev/null || ! command -v qemu-riscv32 >/dev/null || ! command -v qemu-system-riscv64 >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y clang lld qemu-user qemu-system-misc
          fi
          missing=""
          for tool in clang ld.lld qemu-riscv32 qemu-system-riscv64; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing tools:$missing"
            exit 1
          fi
          clang --version | head -1
          qemu-riscv32 --version | head -1
          qemu-system-riscv64 --version | head -1

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[all]"
          python3 -m pip install numpy "pytest==9.1.1"
          python3 -m pip install "ziglang==0.14.1"
          echo "SCRATCHV_CC=$(python3 -c 'from pathlib import Path; import ziglang; print(Path(ziglang.__file__).parent / "zig")')" >> "$GITHUB_ENV"

      # ── docs:interfaces / docs:risks ──────────────────────────────────
      - name: "docs:interfaces + docs:risks"
        id: docs
        run: python3 scripts/check_llm_deploy_docs.py --week W1

      - name: "docs:linux-reproduction"
        run: python3 scripts/check_linux_repro_docs.py --check-bash

      # ── probe:qemu-matmul ─────────────────────────────────────────────
      - name: "probe:qemu-matmul"
        id: matmul
        run: |
          set -euo pipefail
          python3 "$PROBE_MATMUL"

      - name: Tensor compiler and runtime regressions
        run: |
          python3 -m pytest \
            tests/test_tensor_c_codegen.py tests/test_tensor_compiler.py \
            tests/test_riscv_tensor_runtime.py tests/test_optimizer_numeric_semantics.py \
            tests/test_qwen_artifact_selection.py tests/test_w1_qwen3_export.py tests/test_qwen3_small_riscv_gate.py \
            tests/test_w1_repro_env.py tests/test_qwen3_full_structure.py \
            tests/test_qwen3_full_audit.py tests/test_qwen3_full_parse.py \
            tests/test_llm_inputs.py tests/test_w2_backend_ops_gate.py \
            tests/test_w2_runtime_gate.py tests/test_w2_runtime_metadata.py \
            tests/test_w2_runtime_reporting.py tests/test_w2_acceptance.py tests/test_w2_ci_results.py \
            tests/test_numeric_metrics.py tests/test_numeric_summary.py tests/test_w2_actions_summary.py -q

      - name: Repeated Linux timeout cleanup regression
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p output/process-cleanup-repeats
          for attempt in $(seq 1 20); do
            python3 -B -m pytest \
              tests/test_riscv_tensor_runtime.py::test_timeout_terminates_only_owned_process_tree \
              -q -p no:cacheprovider \
              --basetemp "output/process-cleanup-repeats/temp-$attempt" \
              --junit-xml="output/process-cleanup-repeats/attempt-$attempt.xml"
          done

      - name: "unit:frontend-ops"
        id: frontend_ops
        run: |
          python3 -m pytest tests/test_qwen3_frontend_patterns.py -q \
            --junit-xml=output/w2-frontend-ops.xml

      - name: "unit:backend-ops"
        id: backend_ops
        timeout-minutes: 15
        run: |
          python3 probes/w2_backend_ops/run.py --output-dir output/w2-backend-ops

      # ── probe:small-transformer ───────────────────────────────────────
      - name: "probe:small-transformer"
        id: transformer
        run: |
          set -euo pipefail
          python3 "$PROBE_TRANSFORMER" --model probes/w1_tiny_transformer/out/tiny_transformer_2l.onnx

      # The real architecture probe uses random weights, needs no checkpoint
      # download, and runs on PRs. Keep its export stack isolated from W1 and
      # the generic compiler tests. Install the CPU wheel before requirements
      # so pip never resolves torch from PyPI with CUDA dependencies.
      - name: Install pinned CPU Qwen3 probe environment
        run: |
          set -euo pipefail
          python3 -m venv output/qwen3-probe-venv
          "$QWEN3_PY" -m pip install --upgrade pip
          "$QWEN3_PY" -m pip install "torch==2.7.1" --index-url https://download.pytorch.org/whl/cpu
          "$QWEN3_PY" -m pip install -r requirements/qwen3-small-probe.txt
          "$QWEN3_PY" -m pip install --no-deps -e .
          "$QWEN3_PY" -m pip check
          "$QWEN3_PY" -c "import torch; assert torch.__version__ == '2.7.1+cpu' and torch.version.cuda is None, torch.__version__"

      - name: W1 reproduction environment preflight
        run: |
          set -euo pipefail
          "$QWEN3_PY" -X utf8 scripts/check_w1_repro_env.py \
            --require-clean --output-dir output/w1-repro-env

      - name: Runtime unit regressions in pinned environment
        run: |
          "$QWEN3_PY" -m pytest \
            tests/test_llm_inputs.py tests/test_qwen3_tokenizer.py \
            tests/test_w2_runtime_gate.py tests/test_w2_runtime_metadata.py \
            tests/test_w2_runtime_reporting.py tests/test_w2_runtime_model.py \
            -q --junit-xml=output/w2-runtime-tests.xml

      - name: "unit:runtime"
        id: runtime
        timeout-minutes: 10
        run: |
          "$QWEN3_PY" probes/w2_runtime/run.py --mode download \
            --tokenizer-dir output/qwen3-tokenizer --output-dir output/w2-runtime

      - name: "integration:runtime-model"
        id: runtime_model
        timeout-minutes: 15
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          "$QWEN3_PY" probes/w2_runtime_model/run.py \
            --tokenizer-dir output/qwen3-tokenizer --output-dir output/w2-runtime-model

      - name: "numeric:ir-qwen3-small"
        id: qwen3_small
        timeout-minutes: 15
        env:
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          "$QWEN3_PY" "$PROBE_QWEN3_SMALL" --output-dir output/qwen3-small

      - name: Explicit Qwen3 artifact optimization integration
        id: qwen3_artifact_tests
        env:
          SCRATCHV_QWEN_ARTIFACT_DIR: output/qwen3-small
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          "$QWEN3_PY" -B -m pytest \
            tests/test_optimizer_numeric_semantics.py::test_real_qwen_artifact_optimization_matches_ort \
            -q -rs -o junit_family=xunit1 --junit-xml=output/qwen3-small/optimization-tests.xml
          "$QWEN3_PY" - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('output/qwen3-small/optimization-tests.xml').getroot().findall('.//testcase')
          expected = {f'test_real_qwen_artifact_optimization_matches_ort[{level}]' for level in ('none', 'basic', 'all')}
          assert len(cases) == 3 and {case.get('name') for case in cases} == expected
          assert not any(case.find(tag) is not None for case in cases for tag in ('skipped', 'failure', 'error'))
          print('Qwen artifact integration: 3 passed, 0 skipped')
          PY

      - name: Qwen3 small probe regressions
        id: qwen3_small_tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          "$QWEN3_PY" -m pytest \
            tests/test_qwen3_small_probe.py \
            tests/test_qwen3_small_model.py \
            tests/test_qwen3_small_gate.py tests/test_qwen3_small_reports.py -q \
            --junit-xml=output/qwen3-small/tests.xml

      - name: "numeric:qemu-qwen3-small"
        id: qwen3_riscv
        timeout-minutes: 25
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          "$QWEN3_PY" probes/w2_qwen3_small/riscv.py \
            --model-dir output/qwen3-small --output-dir output/qwen3-riscv

      - name: Summarize W2 unit gates
        if: always()
        env:
          FRONTEND_OUTCOME: ${{ steps.frontend_ops.outcome }}
          BACKEND_OUTCOME: ${{ steps.backend_ops.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          RUNTIME_MODEL_OUTCOME: ${{ steps.runtime_model.outcome }}
        run: |
          {
            echo "## W2 测试项"
            echo "unit:frontend-ops: $FRONTEND_OUTCOME"
            echo "unit:backend-ops: $BACKEND_OUTCOME"
            echo "unit:runtime: $RUNTIME_OUTCOME"
            echo "integration:runtime-model: $RUNTIME_MODEL_OUTCOME"
            emit_report() {
              report="$1"; outcome="$2"
              if [ "$outcome" = "skipped" ] || [ -z "$outcome" ]; then
                echo "未运行: $report。无数值验收结论。"
              elif [ -f "$report" ]; then
                cat "$report"
              else
                echo "未生成报告: $report (步骤: $outcome)。无数值验收结论，请查看日志。"
              fi
            }
            emit_report output/w2-backend-ops/report.md "$BACKEND_OUTCOME"
            emit_report output/w2-runtime/report.md "$RUNTIME_OUTCOME"
            emit_report output/w2-runtime-model/report.md "$RUNTIME_MODEL_OUTCOME"
            echo "这些门槛不执行完整模型 IR/QEMU，也不执行文本生成。"
          }

      - name: Upload W2 unit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w2-unit-gates-output
          path: |
            output/w2-backend-ops/
            output/w2-runtime/
            output/w2-runtime-model/report.*
            output/w2-frontend-ops.xml
            output/w2-runtime-tests.xml
          if-no-files-found: ignore

      - name: Upload RISC-V tensor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riscv-tensor-probe-output
          path: |
            output/qemu-matmul/
            output/qwen3-riscv/
            output/process-cleanup-repeats/*.xml
          if-no-files-found: ignore

      - name: Summarize RISC-V numeric gate
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.qwen3_riscv.outcome }}
        run: |
          {
            echo "## numeric:qemu-qwen3-small"
            echo "步骤结果: $PROBE_OUTCOME"
            if [ "$PROBE_OUTCOME" = "skipped" ] || [ -z "$PROBE_OUTCOME" ]; then
              echo "未运行。无 QEMU 数值验收结论。"
            elif [ -f output/qwen3-riscv/report.md ]; then
              cat output/qwen3-riscv/report.md
            else
              echo "未生成报告。无 QEMU 数值验收结论，请查看日志。"
            fi
          }

      - name: Summarize Qwen3 small probe
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.qwen3_small.outcome }}
          TEST_OUTCOME: ${{ steps.qwen3_small_tests.outcome }}
          ARTIFACT_TEST_OUTCOME: ${{ steps.qwen3_artifact_tests.outcome }}
        run: |
          {
            echo "## numeric:ir-qwen3-small"
            echo "Probe: $PROBE_OUTCOME；回归测试: $TEST_OUTCOME"
            echo "显式 artifact 集成（要求 3 passed / 0 skipped）: $ARTIFACT_TEST_OUTCOME"
            echo ""
            if [ "$PROBE_OUTCOME" = "skipped" ] || [ -z "$PROBE_OUTCOME" ]; then
              echo "未运行。无 IR 数值验收结论。"
            elif [ -f output/qwen3-small/report.md ]; then
              cat output/qwen3-small/report.md
            else
              echo "未生成报告。无 IR 数值验收结论，请查看日志。"
            fi
          }

      - name: Upload Qwen3 small probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-small-probe-output
          path: output/qwen3-small/
          if-no-files-found: ignore

      - name: Upload W1 reproduction environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1-reproduction-environment
          path: output/w1-repro-env/
          if-no-files-found: ignore

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1-probe-output
          path: probes/**/out/
          if-no-files-found: ignore

      # ── 状态汇总 ──────────────────────────────────────────────────────
      - name: W1 交付物状态
        if: always()
        env:
          DOCS_OUTCOME: ${{ steps.docs.outcome }}
          MATMUL_OUTCOME: ${{ steps.matmul.outcome }}
          TRANSFORMER_OUTCOME: ${{ steps.transformer.outcome }}
          QWEN_IR_OUTCOME: ${{ steps.qwen3_small.outcome }}
          QWEN_RISCV_OUTCOME: ${{ steps.qwen3_riscv.outcome }}
        run: |
          {
            echo "## W1 测试项"
            echo ""
            echo "| 门槛 | 实际步骤结果 |"
            echo "|---|---|"
            echo "| 文档结构 | $DOCS_OUTCOME |"
            echo "| QEMU MatMul | $MATMUL_OUTCOME |"
            echo "| 合成 Transformer IR | $TRANSFORMER_OUTCOME |"
            echo "| 真实 Qwen3 结构 IR | $QWEN_IR_OUTCOME |"
            echo "| 真实 Qwen3 结构 QEMU | $QWEN_RISCV_OUTCOME |"
            echo ""
            echo "完整模型 ORT 验证在独立的手动/夜间 job 中运行。"
            echo "文档检查不构成团队接口批准或他人复现的证明。"
          } >> "$GITHUB_STEP_SUMMARY"

  full-qwen3-onnx:
    name: "W1 / full Qwen3 ONNX release validation"
    # This downloads 1.24 GB and executes the 2.38 GB FP32 model. It is not
    # counted as a passing gate on PRs where it did not execute.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned full-model validation dependencies
        run: |
          python3 -m pip install "numpy==2.2.6" "onnx==1.18.0" "onnxruntime==1.22.1" "protobuf==5.29.5"
          python3 -m pip check
      - name: "probe:qwen3-onnx"
        id: full_model
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          python3 "$PROBE_QWEN3_EXPORT" --mode download \
            --model-dir output/qwen3-full-model \
            --output-dir output/qwen3-full-probe --threads 2
      - name: Summarize full-model gate
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.full_model.outcome }}
        run: |
          {
            echo "## W1 测试项"
            echo "步骤结果: $PROBE_OUTCOME"
            if [ -f output/qwen3-full-probe/report.md ]; then
              cat output/qwen3-full-probe/report.md
            else
              echo "未生成报告；请检查失败的步骤。"
            fi
            echo "这验证完整 ONNX 产物，不代表 ScratchV 的完整模型执行。"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full-model validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-full-onnx-probe-output
          path: output/qwen3-full-probe/
          if-no-files-found: ignore


  full-qwen3-frontend:
    name: "W2 / complete Qwen3 frontend"
    # Required on PRs as well as manual/nightly runs. No full-model ORT or IR inference.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned frontend audit dependencies
        run: |
          python3 -m pip install "numpy==2.2.6" "onnx==1.18.0" "onnxruntime==1.22.1" "protobuf==5.29.5"
          python3 -m pip check
      - name: "frontend:parse-qwen3"
        id: full_frontend
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          python3 "$PROBE_QWEN3_PARSE" --mode download \
            --model-dir output/qwen3-full-model \
            --output-dir output/qwen3-parse --timeout 1200
      - name: Summarize complete Qwen3 frontend gate
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.full_frontend.outcome }}
        run: |
          {
            echo "## W2 测试项"
            echo "步骤结果: $PROBE_OUTCOME"
            if [ -f output/qwen3-parse/report.md ]; then
              cat output/qwen3-parse/report.md
            fi
            echo "仅完整图与绑定审计；不声称完整 IR 或 QEMU 数值结果。"
          }
      - name: Upload complete Qwen3 frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-full-frontend-parse-output
          path: output/qwen3-parse/
          if-no-files-found: ignore

  w2-acceptance:
    name: "W2 / required acceptance"
    needs: [llm-deploy, full-qwen3-frontend]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # 每个 artifact 的存储根目录不同：多路径上传的以 output/ 为根，单目录
      # 上传的以该目录自身为根，所以只能逐个下载到各自的 --report-dir 位置。
      - name: Download W2 unit gate reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: w2-unit-gates-output
          path: output
      - name: Download RISC-V tensor reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: riscv-tensor-probe-output
          path: output
      - name: Download Qwen3 small reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qwen3-small-probe-output
          path: output/qwen3-small
      - name: Download complete Qwen3 frontend report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qwen3-full-frontend-parse-output
          path: output/qwen3-parse
      - name: List downloaded W2 reports
        if: always()
        run: find output -name report.json -print 2>/dev/null | sort || true
      - name: Summarize W2 operators, precision and timing
        if: always()
        run: python3 scripts/summarize_w2_ci.py --report-dir output
      - name: Require actual success from every W2 job
        env:
          W2_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/check_w2_ci_results.py

  # ── W3：opt-in 的完整数值门槛（原 w3-preparation / w3-full-numeric / w3-nightly） ──
  #
  # 三个 job 共用同一个守卫：手动 dispatch 且 run_w3_validation=true，或定时
  # 且仓库变量 W3_NIGHTLY_ENABLED=='true'。等价于合并前 llm-deploy.yml 的入口
  # 守卫与 w3-nightly.yml 的 opt-in 守卫的合取。
  w3-preparation:
    name: "W3 / preparation"
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_w3_validation) || (github.event_name == 'schedule' && vars.W3_NIGHTLY_ENABLED == 'true') }}
    concurrency:
      # 与 w3-full-numeric / llm-deploy 用不同 group，避免同一 ref 上互相阻塞。
      group: w3-preparation-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The ONNX benchmark regression archives a pinned historical baseline.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Record Linux runner resources
        run: |
          set -euo pipefail
          mkdir -p output
          {
            printf 'commit=%s\nrun_id=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            cat /etc/os-release
            uname -a
            lscpu
            free -b
            df -B1 .
          } | tee output/w3-runner-resources.txt
      - name: Install fixed CPU environment and QEMU
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-misc
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/qwen3-small-probe.txt PyYAML==6.0.3
          python -m pip install -e . ziglang==0.14.1
          python -m pip check
          python -m pip freeze > output/w3-dependencies.txt
          python --version >> output/w3-runner-resources.txt
          qemu-system-riscv64 --version >> output/w3-runner-resources.txt
          python -m ziglang version >> output/w3-runner-resources.txt
          echo "SCRATCHV_CC=$(python -c 'from pathlib import Path; import ziglang; print(Path(ziglang.__file__).parent / "zig")')" >> "$GITHUB_ENV"
      - name: W3 and affected W2/IR regressions
        run: |
          set -euo pipefail
          mkdir -p output
          python -B -X utf8 -m pytest tests/test_w3*.py tests/test_qwen3_medium*.py tests/test_ir_interpreter*.py tests/test_onnx*.py tests/test_qwen3_small_model.py tests/test_qwen3_small_probe.py tests/test_qwen3_small_gate.py tests/test_qwen3_small_riscv_gate.py tests/test_w2_runtime_model.py -q -p no:cacheprovider --basetemp output/pytest-w3 --junitxml output/w3-tests.xml
      - name: Download and verify fixed assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import snapshot_download
          from probes.w1_qwen3_export.run import MANIFEST, acquire_model
          from probes.w3_qwen3_subgraphs.assets import verify_source
          source = Path("output/assets/source")
          snapshot_download(repo_id=MANIFEST["model_id"], revision=MANIFEST["revision"],
                            local_dir=source, allow_patterns=["model.safetensors"] + [x["name"] for x in MANIFEST["source_files"]])
          verify_source(source)
          acquire_model(Path("output/assets/onnx"))
          PY
      - name: Five preparation checks (not full-model acceptance)
        id: probe
        run: |
          python -B -X utf8 scripts/run_w3_preparation.py --source-dir output/assets/source --model-dir output/assets/onnx --output-dir output/w3-preparation --cc "$SCRATCHV_CC" --qemu qemu-system-riscv64
      - name: Summarize W3 preparation evidence
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: python -B -X utf8 scripts/summarize_w3_ci.py --kind preparation --report-dir output/w3-preparation
      - name: Retain bounded selected trace and failure evidence
        if: always()
        run: |
          python -B -X utf8 scripts/collect_w3_ci_evidence.py --source output/w3-preparation --destination output/w3-diagnostics
      - name: Upload preparation reports (30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3-preparation-reports
          if-no-files-found: warn
          retention-days: 30
          path: |
            output/w3-runner-resources.txt
            output/w3-dependencies.txt
            output/w3-tests.xml
            output/w3-preparation/**/report.json
            output/w3-preparation/**/report.md
            output/w3-preparation/**/report.html
            output/w3-preparation/**/trace_schema.json
            output/w3-preparation/logs/*.log
            output/w3-diagnostics/retained-files.json
            output/w3-diagnostics/retained-evidence.json
      - name: Upload selected diagnostic evidence (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3-preparation-diagnostics
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
          path: |
            output/w3-diagnostics/

  w3-full-numeric:
    name: "W3 / complete IR numeric"
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_w3_validation) || (github.event_name == 'schedule' && vars.W3_NIGHTLY_ENABLED == 'true') }}
    concurrency:
      group: w3-full-numeric-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONIOENCODING: utf-8
      SELECTED_CASE: ${{ inputs.w3_case || 'all' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate requested coverage
        run: |
          set -euo pipefail
          case "${SELECTED_CASE:-all}" in
            all|short_17) ;;
            *) printf 'Unsupported case: %s\n' "$SELECTED_CASE" >&2; exit 1 ;;
          esac
      - name: Record Linux runner resources
        run: |
          set -euo pipefail
          mkdir -p output
          {
            printf 'commit=%s\nrun_id=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            cat /etc/os-release
            uname -a
            lscpu
            free -b
            df -B1 .
          } | tee output/w3-runner-resources.txt
      - name: Install fixed CPU environment
        run: |
          set -euo pipefail
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/qwen3-small-probe.txt PyYAML==6.0.3
          python -m pip install -e .
          python -m pip check
          python -m pip freeze > output/w3-dependencies.txt
          python --version >> output/w3-runner-resources.txt
      - name: Full runner and memory policy regressions
        run: |
          set -euo pipefail
          mkdir -p output
          python -B -X utf8 -m pytest tests/test_w3_full*.py tests/test_w3_actions_summary.py tests/test_w3_workflows.py tests/test_ir_interpreter*.py tests/test_onnx_initializers.py -q -p no:cacheprovider --basetemp output/pytest-w3-full --junitxml output/w3-full-tests.xml
      - name: Download fixed ONNX assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from probes.w1_qwen3_export.run import acquire_model
          acquire_model(Path("output/assets/onnx"))
          PY
      - name: Compare complete IR and ORT outputs
        id: probe
        run: |
          set -euo pipefail
          args=()
          SELECTED_CASE="${SELECTED_CASE:-all}"
          if [[ "$SELECTED_CASE" != "all" ]]; then args=(--case "$SELECTED_CASE"); fi
          python -B -X utf8 probes/w3_qwen3_full/run.py --model-dir output/assets/onnx --output-dir output/w3-full --worker-timeout 1800 --max-worker-memory-gib 8 --fp32-mode reference "${args[@]}"
      - name: Summarize W3 full numerical evidence
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: python -B -X utf8 scripts/summarize_w3_ci.py --kind full --report-dir output/w3-full
      - name: Record evidence retention scope
        if: always()
        run: |
          mkdir -p output
          cat > output/w3-full-evidence-retention.json <<'JSON'
          {
            "reports_retention_days": 30,
            "raw_evidence_retention_days": 3,
            "reports_scope": "Reports, hashes and schemas record the original run's checks; reports alone cannot independently revalidate the numerical results.",
            "independent_revalidation": "Download w3-full-numeric-raw before expiry to retain the complete emitted inputs, logits, diagnostic logits and checkpoints together with reports. Failed or interrupted runs may contain incomplete evidence."
          }
          JSON
      - name: Upload numerical reports (30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3-full-numeric-reports
          if-no-files-found: warn
          retention-days: 30
          path: |
            output/w3-runner-resources.txt
            output/w3-dependencies.txt
            output/w3-full-tests.xml
            output/w3-full-evidence-retention.json
            output/w3-full/**/report.json
            output/w3-full/**/report.md
            output/w3-full/**/report.html
            output/w3-full/**/progress.json
            output/w3-full/**/*.log
            output/w3-full/**/checkpoint_schema.json
      - name: Upload full raw numerical evidence (3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3-full-numeric-raw
          if-no-files-found: warn
          retention-days: 3
          compression-level: 1
          path: |
            output/w3-runner-resources.txt
            output/w3-dependencies.txt
            output/w3-full-tests.xml
            output/w3-full-evidence-retention.json
            output/w3-full/**/report.json
            output/w3-full/**/report.md
            output/w3-full/**/report.html
            output/w3-full/**/progress.json
            output/w3-full/**/*.log
            output/w3-full/**/inputs.npz
            output/w3-full/**/checkpoint_schema.json
            output/w3-full/**/checkpoints.npz
            output/w3-full/**/logits.npy
            output/w3-full/**/diagnostic_logits.npy

  w3-acceptance:
    name: "W3 / required acceptance"
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.run_w3_validation) || (github.event_name == 'schedule' && vars.W3_NIGHTLY_ENABLED == 'true')) }}
    needs: [w3-preparation, w3-full-numeric]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PREPARATION_RESULT: ${{ needs.w3-preparation.result }}
      FULL_NUMERIC_RESULT: ${{ needs.w3-full-numeric.result }}
    steps:
      - name: Require both complete gates
        run: |
          set -euo pipefail
          {
            printf '## W3 测试项\n\n'
            printf '提交: `%s`\n\n' "$GITHUB_SHA"
            printf '| 门槛 | 结果 |\n| --- | --- |\n'
            printf '| 准备 (preparation) | %s |\n' "$PREPARATION_RESULT"
            printf '| Complete seven-case Qwen3 IR numeric | %s |\n\n' "$FULL_NUMERIC_RESULT"
            printf '只有两道门槛都为 success 本次运行才通过。这不批准 W3 团队里程碑，也不替代独立复现。\n'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$PREPARATION_RESULT" = success
          test "$FULL_NUMERIC_RESULT" = success

  w3-execution-summary:
    name: "W3 / execution scope"
    needs: [w3-acceptance]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: State whether W3 actually ran
        env:
          W3_RESULT: ${{ needs.w3-acceptance.result }}
        run: |
          python3 - <<'PY'
          import os
          result = os.environ.get("W3_RESULT", "")
          labels = {"success": "PASS", "failure": "FAIL", "cancelled": "CANCELLED", "skipped": "NOT RUN"}
          label = labels.get(result, "UNCONFIRMED")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("## W3 测试项\n\n")
              stream.write(f"**{label}** — W3 准备与完整 28 层 IR 数值。\n\n")
              if result == "skipped":
                  stream.write("W3 是可选门槛，PR 上默认不执行。W1/W2 通过不等于 W3 验收。\n\n")
              elif result == "success":
                  stream.write("数值数据见本次运行中 w3-preparation 与 w3-full-numeric 两个 job 的概要。\n\n")
              else:
                  stream.write("未声称 W3 验收；请检查被调用的 job 以及可能的残缺证据。\n\n")
              stream.write("<details><summary>范围与证据</summary>\n\n手动运行 LLM Deploy 可开启 `run_w3_validation`。"
                           "数值报告在生成后保留于 `w3-preparation-reports` 与 `w3-full-numeric-reports`。"
                           "完整模型 QEMU 是独立的 W4 门槛；独立复现与团队签署另行进行。\n\n</details>\n")
          PY
