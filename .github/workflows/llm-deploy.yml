name: LLM Deploy v1.0

# CI for the Qwen3-0.6B-on-RISC-V project (docs/llm-deploy-v1.0/).
#
# Separate from ci.yml on purpose: that one tests the ScratchV compiler, this
# one tests the deployment project. A failure here should not read as "the
# compiler is broken".
#
# ONE job, steps in sequence. Steps cover W1 probes and the W2 real-Qwen3
# architecture gate (开发计划.md §4.3):
#
#   docs:interfaces  docs:risks
#   probe:qemu-matmul  probe:small-transformer  probe:qwen3-onnx
#   numeric:ir-qwen3-small
#
# Trade-off being made deliberately: one job means one sidebar row and one
# thing to look at, at the cost of knowing only the FIRST failure per run —
# steps after a failed one are skipped. If that becomes annoying, split them
# back out; the step groups below are the seams.
#
# Later weeks' gates (numeric:ir-full-qwen3 at W3, numeric:qemu-full-qwen3 at
# W4, e2e:qemu-paris at W5, release:gate at W8) are NOT stubbed here. They get
# added when their week arrives, from the plan's §4.3 table.

on:
  pull_request:
    paths:
      - 'docs/llm-deploy-v1.0/**'
      - 'probes/**'
      - 'scripts/check_llm_deploy_docs.py'
      - 'export_qwen3_onnx.py'
      - 'scratchv/**'
      - 'requirements/qwen3-small-probe.txt'
      - 'tests/test_qwen3_small*.py'
      - '.github/workflows/llm-deploy.yml'
  schedule:
    # Nightly, off the hour: 19:23 UTC = 03:23 北京时间.
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Deliverables the probes are expected to provide. A probe step only runs
  # once its script exists, so the pipeline is green while a week's work is in
  # flight and goes hard-red the moment the script is there but wrong.
  PROBE_MATMUL: probes/w1_matmul_4x4/run.py
  PROBE_TRANSFORMER: probes/w1_tiny_transformer/run.py
  PROBE_QWEN3_EXPORT: probes/w1_qwen3_export/run.py
  PROBE_QWEN3_SMALL: probes/w2_qwen3_small/run.py
  QWEN3_PY: output/qwen3-probe-venv/bin/python

jobs:
  llm-deploy:
    name: "LLM Deploy v1.0 / W1"
    runs-on: ubuntu-latest
    # Sized for the whole sequence. The Qwen3 export is the long pole; if it
    # ever needs more than a hosted runner has (7 GB RAM, 2 cores), that step
    # has to move to the self-hosted runner and this job splits in two.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # ── 前置：RISC-V 工具链 + Python 依赖 ──────────────────────────────
      - name: Install RISC-V toolchain and QEMU
        run: |
          set -euo pipefail
          if ! command -v clang >/dev/null || ! command -v ld.lld >/dev/null || ! command -v qemu-riscv32 >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y clang lld qemu-user
          fi
          missing=""
          for tool in clang ld.lld qemu-riscv32; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing tools:$missing"
            exit 1
          fi
          clang --version | head -1
          qemu-riscv32 --version | head -1

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[all]"
          python3 -m pip install numpy

      # ── docs:interfaces / docs:risks ──────────────────────────────────
      - name: "docs:interfaces + docs:risks"
        run: python3 scripts/check_llm_deploy_docs.py --week W1

      # ── probe:qemu-matmul ─────────────────────────────────────────────
      - name: "probe:qemu-matmul"
        # The file check lives inside the step rather than in an `if`, because
        # a job-level condition is evaluated before the repository is on disk.
        run: |
          set -euo pipefail
          if [ ! -f "$PROBE_MATMUL" ]; then
            echo "::notice::$PROBE_MATMUL not delivered yet — W1 probe pending"
            exit 0
          fi
          python3 "$PROBE_MATMUL"

      # ── probe:small-transformer ───────────────────────────────────────
      - name: "probe:small-transformer"
        run: |
          set -euo pipefail
          if [ ! -f "$PROBE_TRANSFORMER" ]; then
            echo "::notice::$PROBE_TRANSFORMER not delivered yet — W1 probe pending"
            exit 0
          fi
          python3 "$PROBE_TRANSFORMER" --model probes/w1_tiny_transformer/out/tiny_transformer_2l.onnx

      # The real architecture probe uses random weights, needs no checkpoint
      # download, and runs on PRs. Keep its export stack isolated from W1 and
      # the generic compiler tests. Install the CPU wheel before requirements
      # so pip never resolves torch from PyPI with CUDA dependencies.
      - name: Install pinned CPU Qwen3 probe environment
        run: |
          set -euo pipefail
          python3 -m venv output/qwen3-probe-venv
          "$QWEN3_PY" -m pip install --upgrade pip
          "$QWEN3_PY" -m pip install "torch==2.7.1" --index-url https://download.pytorch.org/whl/cpu
          "$QWEN3_PY" -m pip install -r requirements/qwen3-small-probe.txt
          "$QWEN3_PY" -m pip install --no-deps -e .
          "$QWEN3_PY" -m pip check
          "$QWEN3_PY" -c "import torch; assert torch.__version__ == '2.7.1+cpu' and torch.version.cuda is None, torch.__version__"

      - name: "numeric:ir-qwen3-small"
        id: qwen3_small
        timeout-minutes: 15
        env:
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          "$QWEN3_PY" "$PROBE_QWEN3_SMALL" --output-dir output/qwen3-small

      - name: Qwen3 small probe regressions
        id: qwen3_small_tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          "$QWEN3_PY" -m pytest \
            tests/test_qwen3_small_probe.py \
            tests/test_qwen3_small_model.py \
            tests/test_qwen3_small_gate.py -q \
            --junit-xml=output/qwen3-small/tests.xml

      - name: Summarize Qwen3 small probe
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.qwen3_small.outcome }}
          TEST_OUTCOME: ${{ steps.qwen3_small_tests.outcome }}
        run: |
          {
            echo "## numeric:ir-qwen3-small"
            echo "Probe: $PROBE_OUTCOME; regression tests: $TEST_OUTCOME"
            echo ""
            if [ -f output/qwen3-small/report.md ]; then
              cat output/qwen3-small/report.md
            else
              echo "No report was produced; inspect the dependency/probe step logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Qwen3 small probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-small-probe-output
          path: output/qwen3-small/
          if-no-files-found: ignore

      # ── probe:qwen3-onnx ──────────────────────────────────────────────
      - name: "probe:qwen3-onnx"
        # Skipped on PRs so the fast gate stays fast; it is the heavy one.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python3 -m pip install onnxruntime transformers
          if [ ! -f "$PROBE_QWEN3_EXPORT" ]; then
            echo "::notice::$PROBE_QWEN3_EXPORT not delivered yet — W1 probe pending"
            exit 0
          fi
          python3 "$PROBE_QWEN3_EXPORT"

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1-probe-output
          path: probes/**/out/
          if-no-files-found: ignore

      # ── 状态汇总 ──────────────────────────────────────────────────────
      - name: W1 交付物状态
        if: always()
        run: |
          echo "## W1 交付物状态" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 交付物 | 状态 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          # scratchv/verification/ir_interpreter.py is not a probe but is the
          # prerequisite for probe:small-transformer's criterion ("IR
          # interpreter vs ORT"). It was a phantom dependency: referenced in
          # seven places, scheduled nowhere, so nothing ever reported it
          # missing. Listing it here is the whole point.
          for f in docs/llm-deploy-v1.0/W1/interfaces.md \
                   docs/llm-deploy-v1.0/W1/risks.md \
                   scratchv/verification/ir_interpreter.py \
                   probes/w1_matmul_4x4/run.py \
                   probes/w1_tiny_transformer/run.py \
                   probes/w1_qwen3_export/run.py ; do
            if [ -f "$f" ]; then
              echo "| \`$f\` | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$f\` | ❌ 未交付 |" >> "$GITHUB_STEP_SUMMARY"
              echo "::notice::W1 交付物未完成: $f"
            fi
          done
