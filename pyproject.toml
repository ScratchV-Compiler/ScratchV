[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scratchv"
version = "0.3.0"
description = "A compiler from ONNX models to RISC-V assembly and LLVM IR"
readme = "README.md"
license = {text = "MIT AND MPL-2.0"}
keywords = ["compiler", "risc-v", "onnx", "llvm", "machine-learning"]
requires-python = ">=3.8"
dependencies = [
    "onnx>=1.14",
    "numpy>=1.24",
    "protobuf>=4.21",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
riscv = ["tinyfive"]
llvm = ["llvmlite"]      # optional: LLVM IR JIT execution
verify = ["onnxruntime"] # optional: ONNX Runtime comparison
llm = ["tokenizers>=0.21,<0.22"] # optional: local Qwen3 text tokenizer; no Torch
# Pinned deployment environment: Ubuntu 24.04 x86_64 / CPython 3.12.
# Use the official CPU wheel so one install does not pull CUDA dependencies.
llm-deploy = [
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.7.1%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl",
    "transformers==4.51.3",
    "onnx==1.18.0",
    "onnxruntime==1.22.1",
    "onnxscript==0.2.7",
    "onnx-ir==0.1.7",
    "numpy==2.2.6",
    "huggingface-hub==0.30.2",
    "safetensors==0.5.3",
    "protobuf==5.29.5",
    "tokenizers==0.21.4",
    "pytest==9.1.1",
    "ziglang==0.14.1",
    "PyYAML==6.0.3",
    "packaging==26.0",
]
all = ["tinyfive", "llvmlite", "onnxruntime"]
topic06 = ["tinyfive", "pytest"]
topic06-report = ["tinyfive", "pytest", "jinja2", "matplotlib"]

[project.urls]
Source = "https://github.com/kinsomwang/ScratchV"
Documentation = "https://github.com/kinsomwang/ScratchV/tree/main/docs/INDEX.md"

[project.scripts]
scratchv = "scratchv.main:main"

[tool.setuptools]
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.txt"]

[tool.setuptools.packages.find]
include = ["scratchv", "scratchv.*", "scratchv_dag", "scratchv_dag.*", "benchmarks", "benchmarks.*"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
# Run the model/toolchain suite explicitly with `python -m pytest tests/llm-deploy`.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "llm-deploy"]
markers = [
    "unit: unit tests",
    "blackbox: black-box tests",
    "integration: integration tests",
    "stress: stress tests",
]

[tool.isort]
profile = "black"
